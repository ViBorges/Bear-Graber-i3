[menu __main __octoprint]
type: disabled

[display]
#    MKS Mini 12864 V3.0 Your display might have to haver connectors flipped. If the neopixels doesnt light up and you are 100% sure you have EXP1 connected to EXP1, try flipping the connector.
lcd_type: uc1701
cs_pin: PB8
a0_pin: PD6
rst_pin: PB9
encoder_pins: ^PA9,^PA10
click_pin: ^!PB5
contrast: 63
spi_software_sclk_pin: PA5
spi_software_mosi_pin: PA7
spi_software_miso_pin: PA6

[pwm_cycle_time beeper]
pin: PD5
value: 0
shutdown_value: 0
cycle_time: 0.0005 ; Default beeper tone in kHz. 1 / 0.0005 = 2000Hz (2kHz)

[neopixel btt_mini12864]
pin: PA15
chain_count: 3
color_order: RGB
initial_RED: 0.0
initial_GREEN: 0.2
initial_BLUE: 0.8

[delayed_gcode welcome]
initial_duration: .1
gcode:
	SET_LED LED=btt_mini12864 RED=0.5 GREEN=0.0 BLUE=0.0 TRANSMIT=0
	SET_LED LED=btt_mini12864 RED=0.0 GREEN=0.0 BLUE=0.5 INDEX=1 TRANSMIT=1

[delayed_gcode welcome1]
initial_duration: 1
gcode:
    M117 Hello!
    
[delayed_gcode welcome2]
initial_duration: 2.5
gcode:
    M117 Ready to make!

### M300  P2000 S2000 ####
[gcode_macro m300]
description: Emits an audible beep.
Usage: M300 [P<duration>] [S<frequency>]
gcode:
  {% set settings = printer.configfile.settings %}
  {% if "output_pin beeper" in printer or "pwm_cycle_time beeper" in printer %}
    {% set P = (params.P|default(100)|int, 0)|max %}
    {% set S = (params.S|default(1000)|int, 0)|max %}
    {% if S == 0 %}
      G4 P{P}
    {% else %}
      SET_PIN PIN=beeper VALUE={% if "output_pin beeper" in settings %}1{%else%}{
          settings["pwm_cycle_time beeper"].scale|default(1.0) * 0.3
        } CYCLE_TIME={ 1.0 / S }
      G4 P{P}
      SET_PIN PIN=beeper VALUE=0
     {% endif %}
      
    {% endif %}
  {% else %}
    {action_respond_info(
       "M300 is disabled. To enable, create a [pwm_cycle_time beeper] config.")}
  {% endif %}

  #### Beep Macro ####
[gcode_macro BEEP]
gcode:
    # Parameters
    {% set i = params.I|default(1)|int %}           ; Iterations (number of times to beep).
    {% set dur = params.DUR|default(100)|int %}     ; Duration/wait of each beep in ms. Default 100ms.
    {% set freq = params.FREQ|default(2000)|int %}  ; Frequency in Hz. Default 2kHz.

    {% for iteration in range(i|int) %}
        {% if freq == 0 %}
          G4 P{dur}
        {% else %}
          SET_PIN PIN=beeper VALUE=0.5 CYCLE_TIME={ 1.0/freq }
          G4 P{dur}
          SET_PIN PIN=beeper VALUE=0
        {% endif %}
    {% endfor %}