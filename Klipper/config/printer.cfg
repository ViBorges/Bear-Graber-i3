[include mainsail.cfg]
[include mini12864v2.cfg]
#[include adxl345.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5200270013504D5930313820-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 3000
max_z_velocity: 15
max_z_accel: 100
square_corner_velocity: 5.0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC0
position_endstop: -15
position_min: -15
position_max: 219
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
hold_current: 0.45
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC1
position_endstop: 0
position_min: 0
position_max: 217
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.80
hold_current: 0.45
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 185
homing_speed: 10
second_homing_speed: 3

#Com motor duplo usar com splitter na porta A sem stealthchop e hold_current
[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 1.20
#hold_current: 0.45
stealthchop_threshold: 0

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.52
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
min_temp: -200
max_temp: 260
min_extrude_temp: 170
max_extrude_only_distance: 500
max_extrude_only_velocity: 25
max_extrude_only_accel: 5000

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.90
hold_current: 0.45
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
min_temp: -200
max_temp: 110

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 28.3
y_offset: 3
#z_offset: 0
speed: 5
samples: 2
sample_retract_dist: 5
samples_result: average
probe_with_touch_mode: true
stow_on_each_sample: false

[safe_z_home]
home_xy_position: 81.1, 106.1
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 31, 19       # Subimos 2mm no Y (de 15 para 17)
mesh_max: 188, 199     # Subimos 2mm no Y (de 195 para 197)
probe_count: 5, 5
algorithm: bicubic
fade_start: 1
fade_end: 10

[fan]
pin: PC6                  # FAN0: Ventoinha de peça (Part Cooling Fan)

[heater_fan hotend_fan]
pin: PB15                  # FAN1: Ventoinha do dissipador do hotend (Liga sozinha acima de 50°C)
heater: extruder
heater_temp: 50.0

#[filament_switch_sensor filament_sensor]
#pause_on_runout: true
#switch_pin: ^!PC15
#runout_gcode:
#    M600
#insert_gcode:
#    RESPOND TYPE=command MSG="Filamento detectado"

[gcode_arcs]
resolution: 0.1

[pause_resume]
recover_velocity: 50

[display_status]

[exclude_object]

[respond]

# ====================================================================
# MACROS DE USO GERAL E MANUTENÇÃO (KLIPPER)
# ====================================================================

[gcode_macro PREHEAT_PETG]
description: Pré-aquece a impressora para PETG (Bico 230C / Mesa 70C)
gcode:
    RESPOND MSG="Iniciando pré-aquecimento para PETG..."
    M140 S70                      ; Define temperatura da mesa para 70C (sem esperar)
    M104 S230                     ; Define temperatura do bico para 230C (sem esperar)
    M117 Pre-aquecendo PETG...

[gcode_macro LOAD_FILAMENT]
description: Aquece o bico e carrega o filamento automaticamente
gcode:
    {% set target_temp = params.TEMP|default(210)|int %}
    M117 Aquecendo para carregar filamento...
    M109 S{target_temp}
    M117 Carregando filamento...
    G91
    G1 E70 F300 ; Avança 50mm de filamento a 5mm/s
    G1 E40 F150 ; Purga mais 40mm devagar
    G90
    M117 Filamento carregado com sucesso!

[gcode_macro UNLOAD_FILAMENT]
description: Aquece o bico e descarrega o filamento automaticamente
gcode:
    {% set target_temp = params.TEMP|default(210)|int %}
    M117 Aquecendo para descarregar filamento...
    M109 S{target_temp}
    M117 Descarregando filamento...
    G91
    G1 E10 F300 ; Purga rapida inicial para soltar a ponta
    G1 E-100 F1000 ; Retrai 100mm de filamento rapidamente
    G90
    M117 Filamento descarregado com sucesso!

[gcode_macro PURGE_LINE]
description: Desenha uma linha de purga na borda esquerda da mesa
gcode:
    G90 ; Coordenadas absolutas
    G1 Z2.0 F3000 ; Eleva o eixo Z levemente
    G1 X0.1 Y20 Z0.3 F5000.0 ; Posiciona no inicio da linha de purga
    G1 X0.1 Y200.0 Z0.3 F1500.0 E15 ; Primeira linha de purga
    G1 X0.4 Y200.0 Z0.3 F5000.0 ; Move ligeiramente para o lado
    G1 X0.4 Y20 Z0.3 F1500.0 E30 ; Segunda linha de purga (retorno)
    G92 E0 ; Reseta a contagem da extrusora
    G1 Z2.0 F3000 ; Eleva o Z para iniciar a impressao com seguranca

[screws_tilt_adjust]
screw1: 6.7, 32.0
screw1_name: Canto Frontal Esquerdo
screw2: 155.7, 32.0
screw2_name: Canto Frontal Direito
screw3: 155.7, 179.0
screw3_name: Canto Traseiro Direito
screw4: 6.7, 179.0
screw4_name: Canto Traseiro Esquerdo
horizontal_move_z: 10
speed: 100
screw_thread: CCW-M3

[gcode_macro PAUSE]
gcode:
    PAUSE

[gcode_macro START_PRINT]
gcode:
    # Captura as temperaturas enviadas pelo OrcaSlicer
    {% set BED_TEMP = params.BED|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER|default(200)|float %}

    # Liga os aquecedores e aguarda atingir a temperatura
    M140 S{BED_TEMP}
    M104 S{EXTRUDER_TEMP}
    M190 S{BED_TEMP}
    M109 S{EXTRUDER_TEMP}

    # Home e Carregamento da Malha
    G90                             ; Coordenadas absolutas
    G28                             ; Home de todos os eixos
    BED_MESH_PROFILE LOAD=default   ; Carrega malha de nivelamento

    # Purge Line (Linha de Expurgo) na lateral esquerda da mesa
    G92 E0                          ; Reseta contagem da extrusora
    G1 Z2.0 F3000                   ; Eleva o bico levemente
    G1 X0.1 Y20 Z0.3 F5000.0        ; Move para a posição inicial da purga
    G1 X0.1 Y140.0 Z0.3 F1500.0 E15 ; Primeira linha de expurgo (Y ate 140 para seguranca)
    G1 X0.4 Y140.0 Z0.3 F5000.0     ; Move ligeiramente para o lado
    G1 X0.4 Y20.0 Z0.3 F1500.0 E30  ; Segunda linha de expurgo retornando
    G92 E0                          ; Reseta a distância da extrusora novamente
    G1 Z2.0 F3000                   ; Pequeno salto para não arrastar na mesa
    G1 X5 Y20 Z0.3 F5000.0          ; Limpeza rápida do bico de lado

[gcode_macro END_PRINT]
gcode:
    M400                            ; Aguarda a fila de movimentos terminar
    G92 E0                          ; Reseta a extrusora
    G1 E-2 F1800                    ; Retrai 2mm rapidamente para cortar o fio
    G91                             ; Posicionamento relativo
    G1 Z10 F600                     ; Sobe 10mm o eixo Z para afastar da peça
    G90                             ; Posicionamento absoluto
    G1 X5 Y200 F6000                ; Move a mesa para a frente (apresenta a peça)
    M104 S0                         ; Desliga bico
    M140 S0                         ; Desliga mesa
    M106 S0                         ; Desliga ventoinha
    M84                             ; Desliga motores

[gcode_macro CANCEL_PRINT]
description: Cancela a impressao atual com procedimento de seguranca
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    G91
    G1 Z10 F3000 ; Sobe o Z 10mm para descolar da peça
    G90
    G1 X0 Y200 F6000 ; Move a mesa para Y=200 (em vez de 220)
    CLEAR_PAUSE
    SDCARD_RESET_FILE
    CANCEL_PRINT_BASE
    M117 Impressao cancelada!

