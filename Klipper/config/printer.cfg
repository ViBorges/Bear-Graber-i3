[include mainsail.cfg]
[include mini12864v2.cfg]
[include adxl345.cfg]

[mcu]
serial: /dev/serial/by-id/usb-Klipper_stm32g0b1xx_5200270013504D5930313820-if00

[printer]
kinematics: cartesian
max_velocity: 300
max_accel: 2000
max_z_velocity: 3
max_z_accel: 20
square_corner_velocity: 5.0

[stepper_x]
step_pin: PB13
dir_pin: !PB12
enable_pin: !PB14
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC0
position_endstop: -13.5
position_min: -13.5
position_max: 220
homing_speed: 50

[tmc2209 stepper_x]
uart_pin: PC11
tx_pin: PC10
uart_address: 0
run_current: 0.80
hold_current: 0.45
stealthchop_threshold: 999999

[stepper_y]
step_pin: PB10
dir_pin: !PB2
enable_pin: !PB11
microsteps: 16
rotation_distance: 40
endstop_pin: ^!PC1
position_endstop: -1
position_min: -1
position_max: 220
homing_speed: 50

[tmc2209 stepper_y]
uart_pin: PC11
tx_pin: PC10
uart_address: 2
run_current: 0.80
hold_current: 0.45
stealthchop_threshold: 999999

[stepper_z]
step_pin: PB0
dir_pin: PC5
enable_pin: !PB1
microsteps: 16
rotation_distance: 8
endstop_pin: probe:z_virtual_endstop
position_min: -5
position_max: 190
homing_speed: 4

[tmc2209 stepper_z]
uart_pin: PC11
tx_pin: PC10
uart_address: 1
run_current: 0.80
hold_current: 0.45
stealthchop_threshold: 999999

[extruder]
step_pin: PB3
dir_pin: !PB4
enable_pin: !PD1
microsteps: 16
rotation_distance: 22.52
nozzle_diameter: 0.400
filament_diameter: 1.750
heater_pin: PC8
sensor_type: Generic 3950
sensor_pin: PA0
control: pid
pid_Kp: 18.50
pid_Ki: 1.60
pid_Kd: 53.30
min_temp: -200
max_temp: 260
min_extrude_temp: 170
max_extrude_only_distance: 200
max_extrude_only_velocity: 25
max_extrude_only_accel: 5000

[tmc2209 extruder]
uart_pin: PC11
tx_pin: PC10
uart_address: 3
run_current: 0.90
hold_current: 0.45
stealthchop_threshold: 999999

[heater_bed]
heater_pin: PC9
sensor_type: Generic 3950
sensor_pin: PC4
control: pid
pid_Kp: 112.50
pid_Ki: 13.46
pid_Kd: 626.40
min_temp: -200
max_temp: 110

[bltouch]
sensor_pin: ^PC14
control_pin: PA1
x_offset: 27
y_offset: 5
z_offset: -1.78
speed: 5
samples: 2
sample_retract_dist: 5
samples_result: average
probe_with_touch_mode: true
stow_on_each_sample: false

[safe_z_home]
home_xy_position: 110,110
speed: 50
z_hop: 10
z_hop_speed: 5

[bed_mesh]
speed: 120
horizontal_move_z: 5
mesh_min: 15,10
mesh_max: 215,215
probe_count: 5,5
algorithm: bicubic
fade_start: 1
fade_end: 10

[fan]
pin: PC6

[heater_fan hotend_fan]
pin: PC7
heater: extruder
heater_temp: 50.0

[controller_fan board_fan]
pin: PB15
stepper: stepper_x, stepper_y, stepper_z, extruder
heater: heater_bed
fan_speed: 1.0
idle_timeout: 60

[filament_switch_sensor filament_sensor]
pause_on_runout: true
switch_pin: ^!PC15
runout_gcode:
    M600
insert_gcode:
    RESPOND TYPE=command MSG="Filamento detectado"

[gcode_arcs]
resolution: 0.1

[pause_resume]
recover_velocity: 50

[display_status]

[respond]

[gcode_macro M600]
gcode:
    PAUSE

[gcode_macro START_PRINT]
gcode:
    G28
    BED_MESH_PROFILE LOAD=default

[gcode_macro END_PRINT]
gcode:
    M400
    G91
    G1 Z10 F600
    G90
    G1 X5 Y210 F6000
    M104 S0
    M140 S0
    M106 S0
    M84

